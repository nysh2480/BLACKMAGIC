<!DOCTYPE html>
<html>
<head>
	<title>BLACMAGIC</title>
	<style>
		.base	{background-color:#000; color:#ccf; user-select:none}
		.unit	{background-color:#000; color:#ccf; border:solid 1px #ccf; user-select:none}
	</style>
</head>

<body class="base" oncontextmenu="return false;" onload="BLACK.SYS.INIT()">
	<p>
		<b>BLACKMAGIC</b>
		<input type="button" class="unit" value="CUI" onclick="BLACK.SYS.ON(this.value)">
		<input type="button" class="unit" value="GUI" onclick="BLACK.SYS.ON(this.value)">
		<input type="button" class="unit" value="SOUND" onclick="BLACK.SYS.ON(this.value)">
		<input type="button" class="unit" value="SERVER" onclick="BLACK.SYS.ON(this.value)">
	</p>

	<div id="GUI" style="display:none">
		<canvas id="screen" class="unit"style="width:360px; height:240px"></canvas>
	</div>

	<div id='CUI' style="display:none">
		<p>
			<input type="button" class="unit" value="RUN" onclick="BLACK.Cbase.run(code.value)"><br>
		</p>
		<textarea id="code" class="unit" cols=80 rows=25 style="user-select:contain"></textarea>
	</div>


	<div id="SOUND" style="display:none">
		<div>SOUND</div>
	</div>

	<div id="SERVER" style="display:none">
		<div>SERVER</div>
	</div>

</body>

<script>
	const BLACK={
		SYS: {
			UI: [ "CUI", "GUI", "SOUND", "SERVER" ] ,
			ON: function(focus){
				for(let i=0; i<BLACK.SYS.UI.length; i++){
					document.getElementById(BLACK.SYS.UI[i]).style.display = (BLACK.SYS.UI[i]==focus) ? "block" : "none"
				}
			} ,
			INIT: function(){
				BLACK.SYS.ON("CUI")
			}
		} ,
      		GUI: {

		} ,
		CUI: {
			RUN: function(code){
				MAGIC.compile(code)
			} ,
		} ,
		SERVER: {

		}
	}
    
	const MAGIC={
		compile: function(code){
			console.log(code)
		}
	}



</script>
</html>
